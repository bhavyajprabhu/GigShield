<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.body.innerHTML = '<div style="color:red; font-family:monospace; padding:20px; font-size: 16px;"><h1>JS Error</h1><p>' + msg + '</p><pre>' + (error && error.stack) + '</pre></div>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red; font-family:monospace; padding:20px; font-size: 16px;"><h1>Unhandled Promise Rejection</h1><p>' + event.reason + '</p></div>';
      });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
